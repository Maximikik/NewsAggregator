<div class="mx-auto max-w-2xl px-4 py-8">
  <h1 class="mb-6 text-2xl font-semibold text-slate-900">Your feed</h1>

  @if (isLoading()) {
    <p class="text-sm text-slate-500">Loading articles…</p>
  } @else if (errorMessage()) {
    <p class="text-sm text-red-600">{{ errorMessage() }}</p>
  } @else if (articles().length === 0) {
    <p class="text-sm text-slate-500">No articles yet. Check back after the next import.</p>
  } @else {
    <div class="space-y-4">
      @for (article of articles(); track article.id) {
        <app-article-card
          [article]="article"
          [isLiked]="likedIds().has(article.id)"
          (liked)="onLike($event)"
        />
      }
    </div>
  }
</div>
