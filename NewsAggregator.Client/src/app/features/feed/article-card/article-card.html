<article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
  <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500">{{ article().source }}</p>
  <h2 class="mb-2 text-lg font-semibold text-slate-900">{{ article().title }}</h2>
  <p class="mb-4 text-sm text-slate-600">{{ article().description }}</p>

  <button
    type="button"
    (click)="onLike()"
    [disabled]="isLiked()"
    class="rounded-md border px-3 py-1.5 text-sm font-medium disabled:cursor-default"
    [class.border-slate-300]="!isLiked()"
    [class.text-slate-700]="!isLiked()"
    [class.hover:bg-slate-50]="!isLiked()"
    [class.border-rose-200]="isLiked()"
    [class.bg-rose-50]="isLiked()"
    [class.text-rose-600]="isLiked()"
  >
    {{ isLiked() ? '♥ Liked' : '♡ Like' }}
  </button>
</article>
