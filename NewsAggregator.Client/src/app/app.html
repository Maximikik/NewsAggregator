<div class="min-h-screen bg-slate-50">
  @if (authService.isAuthenticated()) {
    <nav class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3">
      <a routerLink="/feed" class="text-lg font-semibold text-slate-900">NewsAggregator</a>
      <div class="flex items-center gap-4">
        @if (authService.userEmail()) {
          <span class="text-sm text-slate-500">{{ authService.userEmail() }}</span>
        }
        <button
          type="button"
          (click)="logout()"
          class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
        >
          Log out
        </button>
      </div>
    </nav>
  }

  <router-outlet />
</div>
