<article
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-lg"
>
  <a [routerLink]="['/articles', article().id]" class="block">
    @if (article().imageUrl && !imageFailed()) {
      <img
        [src]="article().imageUrl"
        (error)="onImageError()"
        alt=""
        class="h-44 w-full object-cover"
      />
    } @else {
      <div
        class="flex h-44 w-full items-center justify-center bg-gradient-to-br from-indigo-50 to-slate-100"
      >
        <svg
          class="h-10 w-10 text-indigo-200"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 16.5V7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5Z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="m3 15 4.5-4.5a1.5 1.5 0 0 1 2.12 0L15 15" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m14 14 1.5-1.5a1.5 1.5 0 0 1 2.12 0L21 15.5" />
          <circle cx="8" cy="9" r="1.25" />
        </svg>
      </div>
    }
  </a>

  <div class="flex flex-1 flex-col p-6">
    <span
      class="mb-3 inline-block w-fit rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-semibold uppercase tracking-wide text-indigo-600"
    >
      {{ article().source }}
    </span>

    <h2 class="mb-2 text-lg font-bold leading-snug text-slate-900">
      <a
        [routerLink]="['/articles', article().id]"
        class="transition-colors group-hover:text-indigo-600"
      >
        {{ article().title }}
      </a>
    </h2>

    <p class="mb-4 line-clamp-3 flex-1 text-sm leading-relaxed text-slate-600">
      {{ article().description }}
    </p>

    <div class="mt-auto flex items-center justify-between pt-2">
      <a
        [routerLink]="['/articles', article().id]"
        class="text-sm font-medium text-indigo-600 hover:text-indigo-700"
      >
        Read more &rarr;
      </a>

      @if (showLikeButton()) {
        <button
          type="button"
          (click)="onLike()"
          [disabled]="isLiked()"
          class="rounded-full border px-3 py-1.5 text-sm font-medium transition-colors disabled:cursor-default"
          [class.border-slate-300]="!isLiked()"
          [class.text-slate-600]="!isLiked()"
          [class.hover:bg-slate-50]="!isLiked()"
          [class.border-rose-200]="isLiked()"
          [class.bg-rose-50]="isLiked()"
          [class.text-rose-600]="isLiked()"
        >
          {{ isLiked() ? '♥ Liked' : '♡ Like' }}
        </button>
      }
    </div>
  </div>
</article>
