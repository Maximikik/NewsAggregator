<article
  class="group flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-200 hover:-translate-y-1 hover:shadow-lg"
>
  <span
    class="mb-3 inline-block w-fit rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-semibold uppercase tracking-wide text-indigo-600"
  >
    {{ article().source }}
  </span>

  <h2 class="mb-2 text-lg font-bold leading-snug text-slate-900">
    <a
      [routerLink]="['/articles', article().id]"
      class="transition-colors group-hover:text-indigo-600"
    >
      {{ article().title }}
    </a>
  </h2>

  <p class="mb-4 line-clamp-3 flex-1 text-sm leading-relaxed text-slate-600">
    {{ article().description }}
  </p>

  <div class="mt-auto flex items-center justify-between pt-2">
    <a
      [routerLink]="['/articles', article().id]"
      class="text-sm font-medium text-indigo-600 hover:text-indigo-700"
    >
      Read more &rarr;
    </a>

    @if (showLikeButton()) {
      <button
        type="button"
        (click)="onLike()"
        [disabled]="isLiked()"
        class="rounded-full border px-3 py-1.5 text-sm font-medium transition-colors disabled:cursor-default"
        [class.border-slate-300]="!isLiked()"
        [class.text-slate-600]="!isLiked()"
        [class.hover:bg-slate-50]="!isLiked()"
        [class.border-rose-200]="isLiked()"
        [class.bg-rose-50]="isLiked()"
        [class.text-rose-600]="isLiked()"
      >
        {{ isLiked() ? '♥ Liked' : '♡ Like' }}
      </button>
    }
  </div>
</article>
